# Weekly catalog refresh.
#
# The catalog is the width of the product, and it goes stale in one direction
# only: models are released, and a machine that could run one is told nothing.
#
# Two independent jobs rather than one. `ingest` talks to a third-party API and
# can be slow or rate-limited; `self-test` is pure arithmetic over known configs
# and is the thing that tells us whether the *derivation* broke. Sharing a job
# would let a Hugging Face timeout hide a real logic failure behind an
# infrastructure one.
#
# The output is a pull request, never a direct push. Every entry changes what
# users are told they can run, and the derivation gate can only reject what it
# recognises as wrong -- a human still reads the diff.

name: catalog

on:
  schedule:
    # Mondays, early UTC. Nothing depends on the exact hour.
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/ingest_hf.py"
      - "scripts/models.txt"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does the derivation still agree with models whose geometry is verified by
  # hand? No network, so this cannot fail for an infrastructure reason.
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/ingest_hf.py --self-test

  # Does what ships still parse, and is every quantisation a possible size for
  # the format it claims? This is the guard against a misread file listing.
  catalog-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo test -p zc-model --quiet

  ingest:
    runs-on: ubuntu-latest
    needs: [self-test]
    # Only the PR-opening job needs write access, and only on a real refresh.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      # Meta and Google gate their base repos behind a licence click, so
      # config.json is a 401 without a token. Without the secret those models
      # are reported as gated and the rest still refresh.
      - name: Fetch and derive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/ingest_hf.py | tee ingest.log

      # New entries must survive the same checks the shipped ones do: every
      # file parses, every quantisation is plausible for its format, and the
      # hand-computed KV figures still hold.
      - name: Validate the result
        run: cargo test -p zc-model --quiet

      - name: Open a pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: catalog/weekly-refresh
          title: "catalog: weekly refresh"
          commit-message: "catalog: weekly refresh from scripts/ingest_hf.py"
          body-path: ingest.log
          delete-branch: true
          add-paths: crates/zc-model/data/models/*.json
