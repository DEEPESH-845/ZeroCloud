[package]
name = "zerocloud-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Renders one ZeroCloud prediction as a terminal table, JSON, or a Markdown bug report."
repository.workspace = true

# Published as zerocloud-report (zc-tui was taken on crates.io); the Rust
# crate keeps its original name so no `use` line or path had to change.
[lib]
name = "zc_report"

[dependencies]
zerocloud-probe = { path = "../zc-probe", version = "0.1.0" }
zerocloud-bench = { path = "../zc-bench", version = "0.1.0" }
zerocloud-model = { path = "../zc-model", version = "0.1.0" }
