[package]
name = "zerocloud-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The interactive terminal UI for `zc check`."
repository.workspace = true

# Published as zerocloud-tui (zc-tui was taken on crates.io); the Rust
# crate keeps its original name so no `use` line or path had to change.
[lib]
name = "zc_tui"

[dependencies]
zerocloud-report = { path = "../zc-report", version = "0.1.0" }
zerocloud-model = { path = "../zc-model", version = "0.1.0" }

# The only crate in this workspace permitted to name crossterm. It buys raw
# mode, key-event parsing and resize handling on Windows -- the one layer
# VERIFICATION.md records as never executed here, and therefore the one layer
# not worth writing blind. Everything decidable lives in `state` and `frame`,
# which never mention it and are tested without a terminal.
crossterm.workspace = true

[dev-dependencies]
zerocloud-probe = { path = "../zc-probe", version = "0.1.0" }
zerocloud-bench = { path = "../zc-bench", version = "0.1.0" }
