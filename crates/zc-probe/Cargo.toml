[package]
name = "zerocloud-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hardware detection for local LLM capacity planning: cores, memory, GPUs, storage and virtualisation."
repository.workspace = true

# Published as zerocloud-probe (zc-tui was taken on crates.io); the Rust
# crate keeps its original name so no `use` line or path had to change.
[lib]
name = "zc_probe"

[dependencies]
# Only pulled in on Unix. Cargo evaluates these cfg predicates at build time,
# so a Windows build never even downloads libc.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Foundation",
] }
