[package]
name = "zc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What can this laptop actually run, and how fast? Measures your machine and predicts local LLM performance."
repository.workspace = true
readme = "../../README.md"
keywords = ["llm", "benchmark", "hardware", "ollama", "gguf"]
categories = ["command-line-utilities"]

[[bin]]
name = "zc"
path = "src/main.rs"

[dependencies]
zc-probe = { path = "../zc-probe", version = "0.1.0" }
zc-bench = { path = "../zc-bench", version = "0.1.0" }
zc-model = { path = "../zc-model", version = "0.1.0" }
zc-runtime = { path = "../zc-runtime", version = "0.1.0" }
zc-report = { path = "../zc-report", version = "0.1.0" }
zc-tui = { path = "../zc-tui", version = "0.1.0" }

# Only for restoring the default SIGPIPE disposition. Rust's runtime ignores
# SIGPIPE so that writes return EPIPE, which `println!` then panics on -- so
# `zc check | head` printed a panic and a backtrace note. Every other crate in
# the workspace stays dependency-free; this one line is the whole reason.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
